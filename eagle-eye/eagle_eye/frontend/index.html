<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fg: #1f2933; --muted: #6b7785; --line: #dfe3e8; --card: #f6f7f9; --ring: #1f2933;
    --LCC: #23904f; --LUA: #7b3fc4; --LCH: #a98200; --pop: #ffffff;
    --font: "Source Sans", "Source Sans Pro", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --fg: #e8eaed; --muted: #9aa5b1; --line: #3a414b; --card: #1e232b; --ring: #f5f6f7;
    --LCC: #5fd08a; --LUA: #b68cf2; --LCH: #f0c63c; --pop: #2a303a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.6; }
  body { padding: 2px; }

  .b-LCC { --c: var(--LCC); } .b-LUA { --c: var(--LUA); } .b-LCH { --c: var(--LCH); }

  /* ---------- annotated text ---------- */
  .doc { white-space: pre-wrap; word-wrap: break-word; padding: 14px 16px; min-height: 340px; max-height: 700px; overflow-y: auto;
         border: 1px solid var(--line); border-radius: 10px; }
  .doc.empty { color: var(--muted); }
  mark.mk { color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
            border-bottom: 2px solid var(--c); border-radius: 3px; padding: 0 1px; font-weight: 600;
            cursor: pointer; transition: opacity .15s, background .15s; }
  mark.mk:hover { background: color-mix(in srgb, var(--c) 28%, transparent); }
  mark.mk.negated { border-bottom-style: dashed; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--c) 55%, transparent); }
  mark.mk.manual { border-bottom-style: double; border-bottom-width: 4px; }
  mark.mk.pending { background: color-mix(in srgb, var(--fg) 14%, transparent); border-bottom: 2px dashed var(--fg); color: inherit; }
  .doc { user-select: text; }
  .tag.manual { color: var(--c); border-color: var(--c); }
  .bcv { margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; vertical-align: middle; cursor: help; }
  .bcv.assumed { opacity: .6; outline: 1px dashed var(--muted); outline-offset: 1px; }
  .bcv-X { background: #2b2b2b; } .bcv-1 { background: #2f6fdd; } .bcv-2 { background: #d9820b; }
  .bcv-3 { background: #d63b3b; } .bcv-4 { background: #8a4fd0; } .bcv-5 { background: #2a9d57; }
  :root[data-theme="dark"] .bcv-X { background: #6b7280; }
  .has-sel mark.mk { opacity: .35; }
  .has-sel mark.mk.sel { opacity: 1; background: color-mix(in srgb, var(--c) 30%, transparent); }
  .has-sel mark.mk.focus { outline: 2px solid var(--c); outline-offset: 1px; }

  /* ---------- class pane ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
  .card { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 10px; margin: 0 0 12px;
          background: var(--card); transition: box-shadow .15s, border-color .15s; }
  .card.active { box-shadow: 0 0 0 2px var(--c); }
  .has-sel .card:not(.active) { opacity: .7; }
  .card > header { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; padding: 10px 14px 6px; cursor: pointer; user-select: none; }
  .card.collapsed > header { padding-bottom: 10px; }
  .card > header:hover .chevron, .card > header:focus-visible .chevron { background: var(--c); color: var(--card); }
  .card > header:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; border-radius: 8px; }
  .chevron { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 24px; height: 24px;
             border: 2px solid var(--c); border-radius: 50%; color: var(--c); font-size: 14px; line-height: 1; font-weight: 700;
             background: color-mix(in srgb, var(--c) 14%, transparent); transition: background .15s, color .15s; }
  .card h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--c); }
  .card .sub { color: var(--muted); font-size: 13px; }
  .card .count { margin-left: auto; font-weight: 700; color: var(--c); }
  .card ul { list-style: none; margin: 0 4px 8px 0; padding: 0 4px 0 8px; position: relative; overflow-y: auto; scrollbar-width: thin; }
  .card .none { padding: 0 14px 12px; color: var(--muted); font-size: 14px; font-style: italic; }
  li.entry { display: flex; gap: 8px; align-items: flex-start; padding: 4px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  li.entry:hover { background: color-mix(in srgb, var(--c) 10%, transparent); }
  li.entry.sel { background: color-mix(in srgb, var(--c) 20%, transparent); border-color: var(--c); }
  li.entry .body { flex: 1; min-width: 0; }
  li.entry .label { font-weight: 600; font-size: 15px; line-height: 1.35; }
  li.entry .meta { font-size: 12px; line-height: 1.35; color: var(--muted); }
  li.entry .meta.crumb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.entry code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--c); }
  li.entry .n { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; color: var(--muted); }
  .tag.excl { color: #c0392b; border-color: #c0392b; }
  .dot.small { width: 8px; height: 8px; margin-top: 9px; flex: none; }
  .conf { margin-left: 6px; font-size: 9px; letter-spacing: 1px; color: var(--muted); vertical-align: middle; }
  .context { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; font-size: 14px; }
  .muted { color: var(--muted); }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; background: var(--card); }
  .help, .help-gap { flex: none; width: 16px; height: 16px; margin-top: 2px; }
  .help { display: inline-flex; align-items: center; justify-content: center;
          padding: 0; border: 0; border-radius: 50%; background: #1a73e8; color: #fff; font: 700 11px/1 var(--font);
          cursor: help; }
  .help:hover, .help:focus-visible { background: #1558b8; outline: 2px solid color-mix(in srgb, #1a73e8 40%, transparent); outline-offset: 1px; }
  .pop { position: fixed; z-index: 50; display: none; width: min(350px, calc(100vw - 12px)); max-height: 340px; overflow-y: auto;
         padding: 10px 14px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--pop); color: var(--fg);
         box-shadow: 0 8px 28px rgba(0, 0, 0, .28); font-size: 13px; line-height: 1.45; }
  .pop h4 { margin: 10px 0 3px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .pop h4:first-child { margin-top: 0; }
  .pop .head { font-weight: 700; color: var(--c); }
  .pop ul { margin: 0 0 0 18px; padding: 0; }
  .pop blockquote { margin: 0; padding-left: 9px; border-left: 3px solid color-mix(in srgb, var(--c) 55%, transparent); white-space: pre-line; }
  .pop code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--c); }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const BLOCKS = {
  LCC: { title: "Land Cover", sub: "LCC · components" },
  LUA: { title: "Land Use", sub: "LUA · attributes" },
  LCH: { title: "Land Characteristics", sub: "LCH" },
};

let args = null;
let selection = null; // {entries: [keys], mention: id | null}
const collapsed = new Set(); // blocks (LCC / LUA / LCH) whose panel the user has folded
const selected = (key) => !!selection && selection.entries.includes(key);

const send = (type, extra) =>
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra), "*");
// Measure the content, not the document: documentElement.scrollHeight never drops below the frame height.
const fitFrame = () =>
  send("streamlit:setFrameHeight", { height: Math.ceil(document.getElementById("root").getBoundingClientRect().height) + 8 });

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Highlighting a class opens its panel and folds the panels of the other class types.
function focusPanels() {
  if (!selection || args.view !== "classes") return;
  const active = new Set(args.payload.entries.filter((e) => selected(e.key)).map((e) => e.block));
  for (const b of Object.keys(BLOCKS)) active.has(b) ? collapsed.delete(b) : collapsed.add(b);
}

let pending = null; // {start, end}: text the user marked, waiting for a class to be assigned

function emit(value) {
  send("streamlit:setComponentValue", { dataType: "json", value: Object.assign({ nonce: Date.now() + Math.random() }, value) });
}

function choose(next) {
  selection = next;
  pending = null;
  focusPanels();
  render();
  emit({ selection: next });
}

// Character offset in the original text of a DOM position inside the annotated text.
function offsetOf(doc, node, offset) {
  const range = document.createRange();
  range.selectNodeContents(doc);
  range.setEnd(node, offset);
  return range.toString().length;
}

function markSelectedText(doc, text) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  if (!doc.contains(range.commonAncestorContainer)) return;
  let start = offsetOf(doc, range.startContainer, range.startOffset);
  let end = offsetOf(doc, range.endContainer, range.endOffset);
  const raw = text.slice(start, end);
  start += raw.length - raw.trimStart().length;
  end -= raw.length - raw.trimEnd().length;
  // A drag rarely hits word edges exactly: take whole words.
  const word = /[\p{L}\p{N}]/u;
  while (start > 0 && word.test(text[start - 1]) && word.test(text[start])) start--;
  while (end < text.length && word.test(text[end]) && word.test(text[end - 1])) end++;
  if (end - start < 2) return;
  sel.removeAllRanges();
  selection = null;
  pending = { start, end };
  render();
  emit({ selection: null, range: pending });
}

function renderText(root, payload) {
  const doc = el("div", "doc");
  const text = payload.text;
  if (!text.trim()) {
    doc.classList.add("empty");
    doc.textContent = "Paste or upload a land cover / land use description to see it annotated here.";
    root.append(doc);
    return;
  }
  // Cut the text wherever a highlight or the pending selection starts or ends.
  const cuts = new Set([0, text.length]);
  for (const m of payload.mentions) [m.start, m.end].forEach((c) => cuts.add(c));
  if (pending) [pending.start, pending.end].forEach((c) => cuts.add(c));
  const points = [...cuts].sort((x, y) => x - y);
  for (let i = 0; i < points.length - 1; i++) {
    const [a, b] = [points[i], points[i + 1]];
    const piece = text.slice(a, b);
    const m = payload.mentions.find((m) => m.start <= a && b <= m.end);
    const marked = pending && pending.start <= a && b <= pending.end;
    if (!m && !marked) {
      doc.append(document.createTextNode(piece));
      continue;
    }
    const mark = el("mark", m ? `mk b-${m.block}` : "mk pending", piece);
    if (marked) mark.classList.add("pending");
    if (m) {
      mark.title = m.tip;
      if (m.negated) mark.classList.add("negated");
      if (m.manual) mark.classList.add("manual");
      if (m.entries.some(selected)) mark.classList.add("sel");
      if (selection && selection.mention === m.id) mark.classList.add("focus");
      mark.addEventListener("click", () => {
        if (window.getSelection().toString().trim()) return; // a drag-selection, not a click
        const same = selection && selection.mention === m.id;
        choose(same || !m.entries.length ? null : { entries: m.entries, mention: m.id });
      });
    }
    doc.append(mark);
  }
  doc.addEventListener("mouseup", () => setTimeout(() => markSelectedText(doc, text), 0));
  root.append(doc);
}

const LEVELS = { high: 3, medium: 2, low: 1 };

// Bar code values (EAGLE bar coding manual, table 3).
const BCV_MEANING = {
  X: "excluded by definition",
  1: "optional, typical but not mandatory",
  2: "selective mandatory (either-or)",
  3: "cumulative mandatory (and)",
  4: "paired mandatory (at least two of the group)",
  5: "exclusive mandatory (only this one)",
};

function bcvBadge(e) {
  const badge = el("span", `bcv bcv-${e.bcv}`, `BCV ${e.bcv}`);
  if (e.bcvBasis === "assumed") badge.classList.add("assumed");
  badge.title = `${BCV_MEANING[e.bcv] || ""}${e.bcvBasis === "assumed" ? " (assumed: no cue in the text)" : e.bcvBasis === "manual" ? " (set manually)" : ""}`;
  return badge;
}

function confidence(level) {
  if (level === "manual") return el("span", "tag manual", "manual");
  const n = LEVELS[level] || 0;
  const badge = el("span", "conf", "●".repeat(n) + "○".repeat(3 - n));
  badge.title = `${level} confidence`;
  return badge;
}

// Help bubble: the explanation of a class pops up on hover (or keyboard focus).
const pop = el("div", "pop");
document.body.append(pop);
let popTimer = null;

function popContent(e) {
  pop.replaceChildren();
  pop.className = `pop b-${e.block}`;
  const section = (title) => pop.append(el("h4", "", title));
  pop.append(el("div", "head", e.label));

  section("Why this class");
  const why = el("ul");
  for (const r of e.reasons) why.append(el("li", "", r));
  pop.append(why);

  if (e.bcv) {
    section(`Bar code value ${e.bcv}`);
    const bcv = el("ul");
    bcv.append(el("li", "", `${BCV_MEANING[e.bcv]}${e.bcvBasis === "assumed" ? " (assumed: no cue in the text)" : e.bcvBasis === "manual" ? " (set manually)" : ""}`));
    for (const r of e.bcvReasons) bcv.append(el("li", "", r));
    pop.append(bcv);
  }
  if (e.definition) {
    section("EAGLE definition");
    pop.append(el("blockquote", "", e.definition));
  }
  if (e.alternatives.length) {
    section("Also considered");
    const alts = el("ul");
    for (const a of e.alternatives) {
      const li = el("li");
      li.append(el("code", "", a.code), document.createTextNode(` ${a.label}`));
      alts.append(li);
    }
    pop.append(alts);
  }
}

function showPop(icon, e) {
  clearTimeout(popTimer);
  popContent(e);
  pop.style.display = "block";
  const r = icon.getBoundingClientRect();
  const w = pop.offsetWidth;
  const h = pop.offsetHeight;
  const left = Math.max(6, Math.min(r.left - 12, window.innerWidth - w - 6));
  const below = r.bottom + 8;
  const top = below + h <= window.innerHeight - 6 ? below : Math.max(6, r.top - h - 8);
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
}

function hidePop(now) {
  clearTimeout(popTimer);
  popTimer = setTimeout(() => (pop.style.display = "none"), now ? 0 : 160);
}

pop.addEventListener("mouseenter", () => clearTimeout(popTimer));
pop.addEventListener("mouseleave", () => hidePop());

function helpBubble(e) {
  const icon = el("button", "help", "?");
  icon.type = "button";
  icon.setAttribute("aria-label", `Why ${e.label}`);
  icon.addEventListener("mouseenter", () => showPop(icon, e));
  icon.addEventListener("focus", () => showPop(icon, e));
  icon.addEventListener("mouseleave", () => hidePop());
  icon.addEventListener("blur", () => hidePop());
  icon.addEventListener("click", (ev) => ev.stopPropagation()); // reading is not selecting
  return icon;
}

// Only SLOTS class rows are visible at once. Every panel with classes gets a share; a panel
// with few classes leaves its unused rows to the others. Longer lists scroll inside their panel.
const SLOTS = 9;
const ROW_PX = 52;

function allocateSlots(payload) {
  const need = {};
  for (const b of Object.keys(BLOCKS)) {
    const n = payload.entries.filter((e) => e.block === b).length;
    if (n && !collapsed.has(b)) need[b] = n;
  }
  const give = {};
  let left = SLOTS;
  for (const b of Object.keys(need)) {
    give[b] = Math.min(need[b], 2);
    left -= give[b];
  }
  while (left > 0) {
    const open = Object.keys(need).filter((b) => need[b] > give[b]);
    if (!open.length) break;
    open.sort((x, y) => need[y] / (give[y] + 1) - need[x] / (give[x] + 1)); // D'Hondt: shares follow the number of classes
    give[open[0]]++;
    left--;
  }
  return give;
}

function renderClasses(root, payload) {
  const slots = allocateSlots(payload);
  const activeBlocks = new Set(payload.entries.filter((e) => selected(e.key)).map((e) => e.block));

  for (const b of Object.keys(BLOCKS)) {
    const entries = payload.entries.filter((e) => e.block === b);
    const total = entries.reduce((n, e) => n + e.mentions.length, 0);
    const card = el("section", `card b-${b}`);
    if (activeBlocks.has(b)) card.classList.add("active");

    const closed = collapsed.has(b);
    if (closed) card.classList.add("collapsed");
    const head = el("header");
    head.setAttribute("role", "button");
    head.tabIndex = 0;
    head.setAttribute("aria-expanded", String(!closed));
    head.append(el("span", "chevron", closed ? "▸" : "▾"), el("h3", "", BLOCKS[b].title), el("span", "sub", BLOCKS[b].sub), el("span", "count", String(total)));
    const toggle = () => {
      closed ? collapsed.delete(b) : collapsed.add(b);
      render();
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        toggle();
      }
    });
    card.append(head);

    if (closed) {
      // header only
    } else if (!entries.length) {
      card.append(el("div", "none", "Nothing detected"));
    } else {
      const list = el("ul");
      list.style.maxHeight = `${(slots[b] || 1) * ROW_PX}px`;
      for (const e of entries) {
        const li = el("li", "entry");
        if (selected(e.key)) li.classList.add("sel");
        const body = el("div", "body");
        const label = el("div", "label", e.label);
        if (e.negated) label.append(el("span", "tag excl", "excluded"));
        if (!e.code) label.append(el("span", "tag", "type only"));
        else label.append(confidence(e.confidence));
        if (e.bcv) label.append(bcvBadge(e));
        body.append(label);
        const meta = el("div", "meta crumb");
        if (e.code) meta.append(el("code", "", e.code), document.createTextNode(e.breadcrumb ? ` · ${e.breadcrumb}` : ""));
        else meta.textContent = e.breadcrumb;
        meta.title = e.code ? `${e.code} · ${e.breadcrumb}` : e.breadcrumb;
        if (meta.textContent) body.append(meta);
        if (e.appliesTo) body.append(el("div", "meta", `describes: ${e.appliesTo}`));
        const hasHelp = e.reasons.length || e.definition || e.alternatives.length || e.bcv;
        li.append(el("i", "dot small"), hasHelp ? helpBubble(e) : el("span", "help-gap"), body, el("span", "n", `×${e.mentions.length}`));
        li.addEventListener("click", () => {
          const same = selection && selection.mention === null && selection.entries.length === 1 && selection.entries[0] === e.key;
          choose(same ? null : { entries: [e.key], mention: null });
        });
        list.append(li);
      }
      card.append(list);
    }
    root.append(card);
  }
}

function render() {
  if (!args) return;
  const root = document.getElementById("root");
  root.replaceChildren();
  pop.style.display = "none";
  root.className = selection ? "has-sel" : "";
  (args.view === "text" ? renderText : renderClasses)(root, args.payload);
  fitFrame();
  requestAnimationFrame(() =>
    document.querySelectorAll(".card ul").forEach((ul) => {
      const li = ul.querySelector("li.sel");
      if (li && (li.offsetTop < ul.scrollTop || li.offsetTop + li.offsetHeight > ul.scrollTop + ul.clientHeight)) {
        ul.scrollTop = Math.max(0, li.offsetTop - 4);
      }
    })
  );
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const before = JSON.stringify(selection);
  args = event.data.args;
  selection = args.selection || null;
  pending = args.pending || null;
  if (JSON.stringify(selection) !== before) focusPanels(); // e.g. a highlight clicked in the text pane
  const theme = event.data.theme;
  const dark = theme ? theme.base === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (theme && theme.font) document.documentElement.style.setProperty("--font", theme.font);
  render();
});

new ResizeObserver(fitFrame).observe(document.getElementById("root"));
send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
