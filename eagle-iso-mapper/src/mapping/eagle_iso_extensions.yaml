# Extension vocabulary for what ISO 19144-2 / the FAO LChS profile does not define.
#
# ISO 19144-2 (LCML) has no code lists for irrigation types, irrigation water sources or irrigation regimes,
# and no structure for land use (ISO 19144-3 is a separate schema) or for general land characteristics.
# The code lists below are therefore a project extension in the style of ISO 19144 code lists
# (lowerCamelCase identifiers). UML: docs/diagrams/irrigation-extension.puml
#
# Anything written from this file is NOT part of a published ISO schema: the FAO LChS tool may not import it.
# `LchsXmlGenerator(extensions=False)` writes the plain LCML subset only.

code_lists:
  IrrigationType:
    flood: "Whole parcel is flooded"
    basin: "Water is held in levelled basins"
    furrow: "Water runs along furrows between crop rows"
    borderStrip: "Water flows over sloping, bordered strips"
    sprinkler: "Water is sprayed under pressure as artificial rain"
    centerPivot: "Sprinkler lateral circles around a centre point (EAGLE: irrigation carousel)"
    linearMove: "Sprinkler lateral moves in a straight line across the field"
    drip: "Water is led to the plants drop by drop through perforated tubes on the ground"
    microSprinkler: "Low-volume micro-sprayers close to the plants"
    subsurfaceDrip: "Drip tubes or tapes buried at or below root level"
    other: "Another method not listed"
    # Not in the first proposal; needed to carry EAGLE LCH-5_1_4_5 without loss.
    gravitySurface: "Surface irrigation by gravity, method not further specified (EAGLE level; parent of flood, basin, furrow, borderStrip)"
    manual: "Water is applied by hand"
    unspecified: "Irrigation is applied, the method is unknown or unspecified"
  WaterSource:
    surfaceWater: "Rivers, streams, canals, lakes"
    groundwater: "Wells, boreholes"
    reservoir: "Storage reservoir or dam"
    recycledWater: "Treated waste water"
    desalinatedWater: "Desalinated sea or brackish water"
    mixed: "More than one source"
    unknown: "Source unknown"
  IrrigationRegime:  # no EAGLE concept feeds this list yet
    permanent: "Irrigated all year"
    seasonal: "Irrigated in a season"
    supplemental: "Irrigation supplements rainfall"
    intermittent: "Irrigated at irregular intervals"
    emergency: "Irrigated only in drought emergencies"

# EAGLE land characteristic -> irrigation attributes. `irrigated` says whether the concept states irrigation.
irrigation:
  LCH-5_1_4_5_1: {label: No Irrigation, irrigated: false}
  LCH-5_1_4_5_2: {label: "Irrigation Applied, Method Unspecified", irrigated: true, irrigationType: unspecified}
  LCH-5_1_4_5_3: {label: Gravity Surface Irrigation, irrigated: true, irrigationType: gravitySurface}  # broader than flood/basin/furrow/borderStrip
  LCH-5_1_4_5_4: {label: Sprinkler Irrigation, irrigated: true, irrigationType: sprinkler}
  LCH-5_1_4_5_5: {label: Irrigation Carousel, irrigated: true, irrigationType: centerPivot}
  LCH-5_1_4_5_6: {label: Drip Irrigation, irrigated: true, irrigationType: drip}  # its micro-sprayers are narrower: microSprinkler
  LCH-5_1_4_5_7: {label: Subsurface Drip Irrigation, irrigated: true, irrigationType: subsurfaceDrip}
  LCH-5_1_4_5_8: {label: Manual Irrigation, irrigated: true, irrigationType: manual}
  LCH-5_1_4_6_1: {label: Groundwater, waterSource: groundwater}
  LCH-5_1_4_6_2: {label: Reservoir, waterSource: reservoir}
  LCH-5_1_4_6_3: {label: Water Course, waterSource: surfaceWater}  # narrower than surface water

# Code list values with no concept of their own in EAGLE, read back (XML -> EAGLE) as the nearest EAGLE concept.
reverse_irrigation_type:
  flood: LCH-5_1_4_5_3
  basin: LCH-5_1_4_5_3
  furrow: LCH-5_1_4_5_3
  borderStrip: LCH-5_1_4_5_3
  linearMove: LCH-5_1_4_5_4
  microSprinkler: LCH-5_1_4_5_6
  other: LCH-5_1_4_5_2

# EAGLE land characteristic -> species of an LCML floristic aspect (written by the plain LCML subset too).
species:
  LCH-5_1_6_1_1_7: Oryza sativa      # Rice Character
  LCH-5_1_6_1_10_2: Humulus lupulus  # Hops Character

# Characteristic class by EAGLE code prefix (the longest prefix wins, on code segment boundaries).
characteristic_classes:
  LCH-5_1_4_5: LC_IrrigationCharacteristic
  LCH-5_1_4_6: LC_IrrigationCharacteristic
  LCH-4_2: LC_WaterRegimeCharacteristic
  LCH-5_1_4: LC_CultivationCharacteristic
  LCH-5: LC_ManagementCharacteristic
default_characteristic_class: LC_GeneralCharacteristic
