# SSSOM Metadata
mapping_set_id: https://w3id.org/eagle/iso-19144-crosswalk
mapping_set_title: EAGLE Concept to ISO 19144 (LCML/LUML) Semantic Mapping
mapping_set_version: 1.0.0
mapping_date: '2026-10-14'
mapping_provider: https://dd.eionet.europa.eu/vocabulary/landcover/eagle/
license: https://creativecommons.org/licenses/by/4.0/
prefixes:
  # CURIEs `eagle:LCC-1_1_1` identify EAGLE concepts by their CODE in the matrix. The Eionet URIs of the
  # vocabulary are slug based (.../LCC-sealed-artificial-surfaces-and-constructions) and travel in the matrix (column A).
  eagle: https://w3id.org/eagle/code/
  iso: https://standards.isotc211.org/19144/
  skos: http://www.w3.org/2004/02/skos/core#
  semmatch: https://w3id.org/semapv/vocab/
  orcid: https://orcid.org/
mapping_justification: semmatch:ManualMappingCuration

# Crosswalk Mappings
mappings:
  # -------------------------------------------------------------------------
  # LAND COVER COMPONENTS (EAGLE LCC <-> ISO 19144-2 LCML, FAO LChS block library)
  # Every object is a block of the FAO LChS tool (src/mapping/fao_lchs_profile.json, checked by the tests).
  # An EAGLE concept without a row of its own takes the row of its nearest ancestor (LCC-1_2_1_1 -> LCC-1_2_1),
  # see SSSOMResolver.resolve_block. closeMatch: nearly the same, broadMatch: the FAO block is broader.
  # -------------------------------------------------------------------------
  - subject_id: eagle:LCC-1
    subject_label: Abiotic, Non-Vegetated Surfaces and Objects
    predicate_id: skos:exactMatch
    object_id: iso:LC_AbioticElement
    object_label: Abiotic Surfaces
    mapping_justification: semmatch:ManualMappingCuration

  - subject_id: eagle:LCC-1_1
    subject_label: Artificial Surfaces and Constructions
    predicate_id: skos:exactMatch
    object_id: iso:LC_ArtificialSurfaceElement
    object_label: Artificial Surfaces
    mapping_justification: semmatch:ManualMappingCuration

  - subject_id: eagle:LCC-1_1_1
    subject_label: Sealed Artificial Surfaces and Constructions
    predicate_id: skos:exactMatch
    object_id: iso:LC_BuiltUpSurface
    object_label: Built-Up Surface
    mapping_justification: semmatch:ManualMappingCuration
    comment: EAGLE sealed surface maps to the LCML built-up surface.

  - subject_id: eagle:LCC-1_1_1_1
    subject_label: Buildings
    predicate_id: skos:exactMatch
    object_id: iso:LC_Building
    object_label: Building
    mapping_justification: semmatch:ManualMappingCuration

  - subject_id: eagle:LCC-1_1_1_1_1
    subject_label: Conventional Buildings
