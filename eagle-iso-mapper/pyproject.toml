[project]
name = "eagle-iso-mapper"
version = "0.2.0"
description = "Bidirectional mapping between EAGLE and ISO semantics using LinkML and SSSOM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "linkml>=1.11.1",
    "lxml>=6.1.1",
    "openpyxl>=3.1.5",
    "pyaml>=26.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "sssom>=0.4.17",
    "streamlit>=1.58.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
